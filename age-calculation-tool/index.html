<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">

    <title>年齢計算ツール</title>
    <link rel="icon" href="favicon.png" type="image/png" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-501GNTE7BK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-501GNTE7BK');
    </script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="navbar navbar-dark bg-brand shadow-sm">
        <div class="container-md d-flex align-items-center">
            <a href="./" class="navbar-brand fw-bold">年齢計算ツール</a>
            <a href="https://link-hub.rutile3.com/" target="_blank" rel="noopener"
                class="d-flex align-items-center text-decoration-none ms-auto">
                <span class="text-white-50 small ms-auto">by Rutile3</span>
                <img src="avatar.png" alt="Avatar" class="avatar ms-2">
            </a>
        </div>
    </header>

    <main class="flex-fill container-md my-4">
        <div class="row g-4">
            <div class="col-lg-5">
                <section class="card shadow-sm h-100">
                    <div class="card-header bg-light fw-semibold">入力</div>
                    <div class="card-body">
                        <p class="text-muted small mb-4">
                            生年月日と基準日を入力すると、年齢を計算します。
                        </p>

                        <form id="ageForm" novalidate>
                            <div class="mb-3">
                                <label for="birthDate" class="form-label fw-semibold">生年月日</label>
                                <div class="input-group">
                                    <input id="birthDate" name="birthDate" type="date" class="form-control" required>
                                    <button id="birthDateTodayButton" type="button" class="btn btn-outline-secondary">今日</button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="targetDate" class="form-label fw-semibold">基準日</label>
                                <div class="input-group">
                                    <input id="targetDate" name="targetDate" type="date" class="form-control" required>
                                    <button id="targetDateTodayButton" type="button" class="btn btn-outline-secondary">今日</button>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-sm-flex">
                                <button id="calculateButton" type="submit" class="btn btn-brand flex-sm-fill">
                                    計算する
                                </button>
                                <button id="clearButton" type="button" class="btn btn-outline-secondary flex-sm-fill">
                                    クリア
                                </button>
                            </div>
                        </form>
                    </div>
                </section>
            </div>

            <div class="col-lg-7">
                <section class="card shadow-sm mb-4" aria-live="polite">
                    <div class="card-header bg-light fw-semibold">計算結果</div>
                    <div class="card-body">
                        <div id="errorArea" class="alert alert-danger d-none" role="alert"></div>

                        <div id="emptyState" class="empty-state text-center py-5">
                            <div class="empty-state-icon mb-3">🎂</div>
                            <p class="text-muted mb-0">生年月日を入力して「計算する」ボタンを押してください。</p>
                        </div>

                        <div id="resultArea" class="d-none">
                            <div class="mb-3 text-muted small">
                                <span id="conditionText"></span>
                            </div>

                            <div class="row g-3">
                                <div class="col-sm-6">
                                    <div class="result-card">
                                        <div class="result-label">満年齢</div>
                                        <div id="fullAgeResult" class="result-value"></div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="result-card">
                                        <div class="result-label">数え年</div>
                                        <div id="countedAgeResult" class="result-value"></div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="result-card">
                                        <div class="result-label">生後日数</div>
                                        <div id="daysSinceBirthResult" class="result-value"></div>
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="result-card">
                                        <div class="result-label">次の誕生日までの日数</div>
                                        <div id="daysUntilBirthdayResult" class="result-value"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="card shadow-sm">
                    <div class="card-header bg-light fw-semibold">補足</div>
                    <div class="card-body small">
                        <ul class="mb-0">
                            <li>満年齢は、生まれた時を0歳とし、誕生日を迎えるごとに1歳増える数え方です。</li>
                            <li>数え年は、生まれた時を1歳とし、1月1日を迎えるごとに1歳増える数え方です。</li>
                            <li>2月29日生まれの場合、うるう年ではない年は2月28日を誕生日相当日として計算します。</li>
                        </ul>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer py-3 bg-brand text-white-50">
        <div class="container-md small">
            <span>© 2026 Rutile3 | MIT License</span>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
