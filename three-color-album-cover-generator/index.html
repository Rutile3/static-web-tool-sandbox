<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">

    <title>3色アルバムカバージェネレーター</title>
    <link rel="icon" href="favicon.png" type="image/png" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-501GNTE7BK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-501GNTE7BK');
    </script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="navbar navbar-dark bg-brand shadow-sm">
        <div class="container-md d-flex align-items-center">
            <a href="" class="navbar-brand fw-bold">3色アルバムカバージェネレーター</a>
            <a href="https://link-hub.rutile3.com/" target="_blank"
                class="d-flex align-items-center text-decoration-none ms-auto">
                <span class="text-white-50 small ms-auto">by Rutile3</span>
                <img src="avatar.png" alt="Avatar" class="avatar ms-2">
            </a>
        </div>
    </header>

    <main class="flex-fill container-md my-4">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-light fw-semibold d-flex align-items-center">
                        <span>色の指定</span>
                        <div class="ms-auto d-flex gap-2">
                            <button id="btnRandom" class="btn btn-primary">ランダム</button>
                            <button id="btnReset" class="btn btn-outline-secondary">初期値</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="vstack gap-3">
                            <div class="d-flex align-items-center">
                                <label for="mainColor" class="flex-grow-1 form-label mb-0">
                                    メインカラー
                                </label>

                                <div class="input-group hex-input-group">
                                    <input id="mainHex" type="text" class="form-control text-end font-monospace"
                                        maxlength="7">

                                    <span class="input-group-text p-0">
                                        <input id="mainColor" type="color" class="color-picker-input">
                                    </span>
                                </div>
                            </div>
                            <div class="d-flex align-items-center">
                                <label for="subColor" class="flex-grow-1 form-label mb-0">
                                    サブカラー
                                </label>

                                <div class="input-group hex-input-group">
                                    <input id="subHex" type="text" class="form-control text-end font-monospace"
                                        maxlength="7">

                                    <span class="input-group-text p-0">
                                        <input id="subColor" type="color" class="color-picker-input">
                                    </span>
                                </div>
                            </div>
                            <div class="d-flex align-items-center">
                                <label for="accentColor" class="flex-grow-1 form-label mb-0">
                                    アクセントカラー
                                </label>

                                <div class="input-group hex-input-group">
                                    <input id="accentHex" type="text" class="form-control text-end font-monospace"
                                        maxlength="7">

                                    <span class="input-group-text p-0">
                                        <input id="accentColor" type="color" class="color-picker-input">
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-light fw-semibold d-flex align-items-center">
                        <span>プレビュー</span>
                        <div class="ms-auto d-flex gap-2">
                            <button id="btnDownloadPNG" class="btn btn-success">PNGで保存</button>
                            <button id="btnDownloadSVG" class="btn btn-outline-secondary">SVGで保存</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="preview-wrap">
                            <div id="preview" class="preview"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer py-3 bg-brand text-white-50">
        <div class="container-md small">
            <span>© 2025 Rutile3 | MIT License</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
