<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">

    <title>多角数計算ツール</title>
    <link rel="icon" href="favicon.png" type="image/png" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-501GNTE7BK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-501GNTE7BK');
    </script>
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="navbar navbar-dark bg-brand shadow-sm">
        <div class="container-md d-flex align-items-center">
            <span class="navbar-brand fw-bold">多角数計算ツール</span>
            <a href="https://link-hub.rutile3.com/" target="_blank"
                class="d-flex align-items-center text-decoration-none ms-auto">
                <span class="text-white-50 small ms-auto">by Rutile3</span>
                <img src="avatar.png" alt="Avatar" class="avatar ms-2">
            </a>
        </div>
    </header>

    <main class="flex-fill container-md my-4">
        <div class="row g-4">
            <!-- Inputs -->
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-light fw-semibold">入力</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="kInput" class="form-label">k（角数 / 3以上）</label>
                            <input id="kInput" type="number" class="form-control" min="3" step="1" value="3">
                            <div class="form-text">例：3=三角数、4=四角数、5=五角数…</div>
                        </div>

                        <div class="mb-3">
                            <label for="nInput" class="form-label">n（番目 / 1以上）</label>
                            <input id="nInput" type="number" class="form-control" min="1" step="1" value="1">
                        </div>

                        <div class="mb-3">
                            <div class="form-label">中心</div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="centered" id="centerOff" value="off"
                                    checked>
                                <label class="form-check-label" for="centerOff">なし（通常の k 角数）</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="centered" id="centerOn" value="on">
                                <label class="form-check-label" for="centerOn">あり（中心付き k 角数）</label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button id="calcBtn" class="btn btn-primary">計算</button>
                            <button id="resetBtn" class="btn btn-outline-secondary">リセット</button>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm mt-4">
                    <div class="card-header bg-light fw-semibold">式（一般形）</div>
                    <div class="card-body mono small">
                        <div class="mb-2">
                            <div class="fw-semibold">中心なし（通常の k 角数）</div>
                            <div class="formula">P(k, n) = ((k − 2)n² − (k − 4)n) / 2</div>
                        </div>
                        <hr>
                        <div>
                            <div class="fw-semibold">中心あり（中心付き k 角数）</div>
                            <div class="formula">C(k, n) = 1 + k n (n − 1) / 2</div>
                            <div class="text-muted">※ご提示の式「C(k,n)=kn(n−1)/2+1」はこちらです。</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Outputs -->
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-light fw-semibold">出力</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="fw-semibold">一般式（選択中）</div>
                            <div id="selectedFormula" class="mono formula"></div>
                        </div>

                        <div class="mb-3">
                            <div class="fw-semibold">代入した式</div>
                            <div id="substitutedFormula" class="mono"></div>
                        </div>

                        <div class="mb-3">
                            <div class="fw-semibold">解</div>
                            <div id="resultValue" class="mono result"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer py-3 bg-brand text-white-50">
        <div class="container-md small">
            <span>© 2025 Rutile3 | MIT License</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
